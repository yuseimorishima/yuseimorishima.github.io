<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>英単語復習ツール</title>

https://cdn.jsdelivr.net/npm/chart.jsscript>

<style>
body{margin:0;font-family:sans-serif;background:#f5f5f5;}
.container{display:flex;height:100vh;}
.sidebar{width:300px;background:#fff;border-right:1px solid #ddd;padding:20px;}
.main{flex:1;padding:20px;overflow:auto;}

.nav-btn{width:100%;padding:12px;margin-bottom:8px;border:none;background:#eee;cursor:pointer;}
.nav-btn.active{background:#0066cc;color:white;}

.card{background:white;padding:20px;border-radius:10px;margin-bottom:15px;}

input{width:100%;padding:10px;margin-top:5px;margin-bottom:10px;}

.button{background:#0066cc;color:white;border:none;padding:10px;border-radius:6px;cursor:pointer;width:100%;}

.correct{color:#27ae60;}
.wrong{color:#e74c3c;}
.folder{padding:8px;border:1px solid #ddd;margin-bottom:5px;cursor:pointer;}
.folder.active{background:#0066cc;color:white;}
</style>
</head>

<body>

<div class="container">

<!-- Sidebar -->
<div class="sidebar">
<h2>復習ツール</h2>

<button class="nav-btn active" onclick="nav(event,'dashboard')">📊 分析</button>
<button class="nav-btn" onclick="nav(event,'words')">📚 管理</button>
<button class="nav-btn" onclick="nav(event,'study')">📝 復習</button>
<button class="nav-btn" onclick="nav(event,'profile')">👤 統計</button>
</div>

<!-- Main -->
<div class="main">

<!-- Dashboard -->
<div id="dashboard">
<div class="card">
<h3>統計</h3>
<p>単語数: <span id="statWords"></span></p>
<p>正解数: <span id="statCorrect"></span></p>
<p>正答率: <span id="statAcc"></span>%</p>
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>
</div>

<!-- Words -->
<div id="words" style="display:none">

<div class="card">
<h3>フォルダ作成</h3>
<input id="folderName" placeholder="フォルダ名">
<button class="button" onclick="addFolder()">作成</button>
</div>

<div class="card">
<h3>フォルダ一覧</h3>
<div id="folderList"></div>
</div>

<div class="card">
<h3>単語追加</h3>
<input id="en" placeholder="英語">
<input id="jp" placeholder="意味">
<button class="button" onclick="addWord()">追加</button>
</div>

<div class="card">
<h3>単語一覧</h3>
<div id="wordList"></div>
</div>

</div>

<!-- Study -->
<div id="study" style="display:none">
<div class="card">
<h2 id="q">Start</h2>
<input id="answer">
<button class="button" onclick="check()">回答</button>
<p id="res"></p>
</div>
</div>

<!-- Profile -->
<div id="profile" style="display:none">
<div class="card">
<p>総問題数: <span id="totalQ"></span></p>
</div>
</div>

</div>
</div>

<script>

/* ===== データ ===== */
let folders = JSON.parse(localStorage.getItem("folders")||"[]");
let selectedFolder = null;
let correct=0,totalQ=0,i=0;
let history=[];

/* ===== ナビ ===== */
function nav(e,id){
 document.querySelectorAll(".main>div").forEach(d=>d.style.display="none");
 document.getElementById(id).style.display="block";
 document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
 e.target.classList.add("active");
}

/* ===== 保存 ===== */
function save(){
 localStorage.setItem("folders",JSON.stringify(folders));
}

/* ===== フォルダ ===== */
function addFolder(){
 if(!folderName.value)return;
 folders.push({name:folderName.value,words:[]});
 folderName.value="";
 save();
 renderFolders();
}

function renderFolders(){
 folderList.innerHTML=folders.map((f,i)=>
  `<div class="folder ${i===selectedFolder?'active':''}" onclick="selectFolder(${i})">${f.name}</div>`
 ).join("");
}

function selectFolder(id){
 selectedFolder=id;
 renderFolders();
 renderWords();
}

/* ===== 単語 ===== */
function addWord(){
 if(selectedFolder===null)return;

 let w={en:en.value,jp:jp.value};
 folders[selectedFolder].words.push(w);

 en.value="";jp.value="";
 save();
 renderWords();
 updateStats();
}

function renderWords(){
 if(selectedFolder===null){wordList.innerHTML="フォルダ選択";return;}
 wordList.innerHTML=folders[selectedFolder].words.map(w=>
  `<div>${w.en} - ${w.jp}</div>`
 ).join("");
}

/* ===== 学習 ===== */
function next(){
 if(selectedFolder===null)return;

 let w=folders[selectedFolder].words;
 if(w.length===0){q.textContent="単語なし";return;}

 if(i>=w.length)i=0;
 q.textContent=w[i].jp;
}

function check(){
 let w=folders[selectedFolder].words;
 if(!w.length)return;

 totalQ++;

 if(answer.value===w[i].en){
  res.innerHTML="<span class='correct'>正解</span>";
  correct++;history.push(1);
 }else{
  res.innerHTML="<span class='wrong'>不正解:"+w[i].en+"</span>";
  history.push(0);
 }

 i++;answer.value="";
 next();
 updateStats();
}

/* ===== 統計 ===== */
function updateStats(){
 let totalWords=folders.reduce((a,f)=>a+f.words.length,0);
 statWords.innerText=totalWords;
 statCorrect.innerText=correct;
 totalQ.innerText=totalQ;

 let acc=totalQ?Math.round(correct/totalQ*100):0;
 statAcc.innerText=acc;

 drawChart();
}

/* ===== グラフ ===== */
let chart;
function drawChart(){
 let ctx=document.getElementById("chart");
 if(chart)chart.destroy();

 chart=new Chart(ctx,{
  type:'line',
  data:{
   labels:history.map((_,i)=>i+1),
   datasets:[{data:history,borderColor:"#0066cc"}]
  }
 });
}

/* ===== 初期 ===== */
renderFolders();
renderWords();
updateStats();

</script>

</body>
</html>
