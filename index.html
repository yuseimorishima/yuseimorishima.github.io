<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>英単語復習ツール 完全版</title>

https://cdn.jsdelivr.net/npm/chart.jsscript>

<style>
body{margin:0;font-family:sans-serif;background:#f5f5f5;}
.container{display:flex;height:100vh;}
.sidebar{width:280px;background:#fff;border-right:1px solid #ddd;padding:20px;}
.main{flex:1;padding:20px;overflow:auto;}

.nav{padding:12px;margin-bottom:8px;background:#eee;border:none;width:100%;cursor:pointer;border-radius:6px;}
.nav.active{background:#0066cc;color:white;}

.card{background:white;padding:20px;border-radius:10px;margin-bottom:20px;box-shadow:0 2px 6px rgba(0,0,0,0.1);}
.button{background:#0066cc;color:white;padding:10px;border:none;border-radius:6px;width:100%;cursor:pointer;}
input{width:100%;padding:10px;margin-bottom:10px;}

.correct{color:#27ae60;}
.wrong{color:#e74c3c;}

.progress{height:6px;background:#eee;border-radius:3px;}
.bar{height:6px;background:#0066cc;border-radius:3px;}

.folder{padding:8px;border:1px solid #ddd;margin-bottom:5px;cursor:pointer;border-radius:6px;}
.folder.active{background:#0066cc;color:white;}
</style>
</head>

<body>

<div class="container">

<!-- sidebar -->
<div class="sidebar">
<h3>英単語ツール</h3>
<button class="nav active" onclick="nav(event,'dashboard')">📊 分析</button>
<button class="nav" onclick="nav(event,'words')">📚 管理</button>
<button class="nav" onclick="nav(event,'study')">📝 学習</button>
<button class="nav" onclick="nav(event,'result')">🏆 結果</button>
</div>

<div class="main">

<!-- dashboard -->
<div id="dashboard">
<div class="card">
<h3>ステータス</h3>
<p>Lv: <span id="lv"></span></p>
<p>XP: <span id="xp"></span></p>
<p>正答率: <span id="acc"></span>%</p>
<div class="progress"><div id="xpbar" class="bar"></div></div>
</div>

<div class="card">
<h3>履歴グラフ</h3>
<canvas id="chart"></canvas>
</div>
</div>

<!-- words -->
<div id="words" style="display:none">
<div class="card">
<h3>フォルダ作成</h3>
<input id="fname">
<button class="button" onclick="addFolder()">追加</button>
<div id="folders"></div>
</div>

<div class="card">
<h3>単語追加</h3>
<input id="en">
<input id="jp">
<button class="button" onclick="addWord()">追加</button>
<div id="wordList"></div>
</div>
</div>

<!-- study -->
<div id="study" style="display:none">
<div class="card">
<h2 id="q">Start</h2>
<input id="ans">
<button class="button" onclick="answer()">回答</button>
<p id="res"></p>
</div>

<div class="card">
<p>進捗</p>
<div class="progress"><div id="prog" class="bar"></div></div>
</div>
</div>

<!-- result -->
<div id="result" style="display:none">
<div class="card">
<h2>結果</h2>
<p>正解: <span id="rc"></span></p>
<p>正答率: <span id="ra"></span>%</p>
<p>XP: +<span id="rxp"></span></p>

<button class="button" onclick="retry()">ミス復習</button>
<button class="button" onclick="startNew()">新しく学習</button>
</div>
</div>

</div>
</div>

<script>

/* ===== データ ===== */
let folders = JSON.parse(localStorage.getItem("f")||"[]");
let sel=null;

let i=0, session=0;
let correct=0,total=0;
let history=[];
let wrong=[];

let xp=+localStorage.getItem("xp")||0;
let lv=+localStorage.getItem("lv")||1;

/* ===== ナビ ===== */
function nav(e,id){
 document.querySelectorAll(".main>div").forEach(d=>d.style.display="none");
 document.getElementById(id).style.display="block";
 document.querySelectorAll(".nav").forEach(b=>b.classList.remove("active"));
 e.target.classList.add("active");
}

/* ===== 保存 ===== */
function save(){
 localStorage.setItem("f",JSON.stringify(folders));
 localStorage.setItem("xp",xp);
 localStorage.setItem("lv",lv);
}

/* ===== フォルダ ===== */
function addFolder(){
 if(!fname.value)return;
 folders.push({name:fname.value,words:[]});
 fname.value="";
 save();
 renderFolders();
}

function renderFolders(){
 foldersEl.innerHTML = folders.map((f,idx)=>
 `<div class="folder ${idx===sel?'active':''}" onclick="selF(${idx})">${f.name}</div>`
 ).join("");
}

function selF(idx){
 sel=idx;
 renderFolders();
 renderWords();
}

/* ===== 単語 ===== */
function addWord(){
 if(sel===null)return;
 folders[sel].words.push({en:en.value,jp:jp.value});
 en.value="";jp.value="";
 save();
 renderWords();
}

function renderWords(){
 if(sel===null)return;
 wordList.innerHTML = folders[sel].words.map(w=>`${w.en} - ${w.jp}`).join("<br>");
}

/* ===== 学習 ===== */
function next(){
 let w=folders[sel]?.words||[];
 if(!w.length){q.textContent="単語なし";return;}
 if(i>=w.length)i=0;
 q.textContent=w[i].jp;
}

function answer(){
 let w=folders[sel].words;
 if(!w.length)return;

 session++; total++;

 let ok = ans.value===w[i].en;

 if(ok){
   res.innerHTML="<span class='correct'>正解</span>";
   correct++; gainXP(10); history.push(1);
 }else{
   res.innerHTML="<span class='wrong'>不正解："+w[i].en+"</span>";
   wrong.push(w[i]); history.push(0);
 }

 ans.value="";
 i++;

 if(session>=10){
   showResult();
 }

 next();
 update();
}

/* ===== XP ===== */
function gainXP(a){
 xp+=a;
 if(xp>=lv*50){
   xp=0; lv++;
   alert("レベルアップ！");
 }
}

/* ===== 結果 ===== */
function showResult(){
 nav({target:document.querySelectorAll(".nav")[3]}, "result");
 rc.textContent=correct;
 ra.textContent=Math.round(correct/total*100)||0;
 rxp.textContent=correct*10;
}

/* ===== 復習 ===== */
function retry(){
 folders[sel].words=[...wrong];
 wrong=[]; session=0; i=0;
 nav({target:document.querySelectorAll(".nav")[2]},"study");
}

function startNew(){
 correct=0; total=0; session=0; i=0;
 nav({target:document.querySelectorAll(".nav")[2]},"study");
}

/* ===== 更新 ===== */
function update(){
 document.getElementById("lv").textContent=lv;
 document.getElementById("xp").textContent=xp;
 let acc=Math.round(correct/total*100)||0;
 document.getElementById("acc").textContent=acc;
 document.getElementById("xpbar").style.width=(xp/(lv*50))*100+"%";
 document.getElementById("prog").style.width=(session/10)*100+"%";
 draw();
}

let chart;
function draw(){
 if(chart)chart.destroy();
 chart=new Chart(document.getElementById("chart"),{
  type:'line',
  data:{labels:history.map((_,i)=>i+1),
  datasets:[{data:history,borderColor:"#0066cc"}]}
 });
}

/* ===== init ===== */
const foldersEl=document.getElementById("folders");
renderFolders();
renderWords();
update();
next();

</script>

</body>
</html>
